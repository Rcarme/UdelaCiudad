services:
  tgmon:
    build: .
    container_name: tgmon
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 1. Código en vivo (te permite editar main.py y ver los cambios al reiniciar el contenedor)
      - ./app:/app/app
      # 2. Permiso para hablar con Docker (Fundamental para el dashboard de TGMON)
      - /var/run/docker.sock:/var/run/docker.sock
      # 3. Lectura de tus composes para la función parse_docker_compose()
      - /home/comstock/docker:/home/comstock/docker:ro
      # 4. Puntos de montaje para almacenamiento externo/secundario (discos USB, SATA, etc.)
      - /media:/media:ro
      - /mnt:/mnt:ro
      - /run/media:/run/media:ro
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - COMPOSE_PATH=/home/comstock/docker/media-stack/docker-compose.yml
      - TGMON_TOKEN=${TGMON_TOKEN:-shodan_secret_2026}
      - TGMON_ADMIN_TOKEN=${TGMON_ADMIN_TOKEN:-${TGMON_TOKEN:-shodan_secret_2026}}
      - TGMON_VIEWER_TOKEN=${TGMON_VIEWER_TOKEN:-}
    networks:
      - homelab

networks:
  homelab:
    external: true
